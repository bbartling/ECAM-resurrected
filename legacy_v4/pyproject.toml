[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecam-resurrected"
version = "0.1.0"
description = "A modern Python resurrection of core ECAM v4 M&V regression workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecam-resurrected = "ecam_resurrected.cli:main"
ecam-resurrected-ui = "ecam_resurrected.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
