name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: python -m pytest --cov=ecam_mv
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python examples/check_release.py dist/*
      - name: Install wheel outside checkout
        run: |
          python -m venv /tmp/ecam-wheel-test
          /tmp/ecam-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ecam-wheel-test/bin/python -c 'from ecam_mv import fit_model; print(fit_model([1,2,3,4], [3,5,7,9], "2p").predict([5]))'
          /tmp/ecam-wheel-test/bin/ecam-mv --version
